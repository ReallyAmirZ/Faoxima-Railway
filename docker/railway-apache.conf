# Railway terminates HTTPS before forwarding requests to Apache.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
UseCanonicalName Off
UseCanonicalPhysicalPort Off

<Directory /var/www/faoxima>
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteCond %{HTTP_HOST} ^([A-Za-z0-9.-]+)(?::[0-9]+)?$
    RewriteRule ^(panel|app|installer)$ https://%1/$1/ [R=302,L,NE]
    php_admin_flag display_errors Off
    php_admin_flag log_errors On
    php_admin_value error_log /proc/self/fd/2
</Directory>

<Directory /var/www/faoxima/docker>
    Require all denied
</Directory>

<Directory /var/www/faoxima/scripts>
    Require all denied
</Directory>

# Keep worker counts modest on small Railway services.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 8
    MaxConnectionsPerChild 500
</IfModule>
